name: Daily commit

on:
  schedule:
    # 06:37 UTC. Deliberately off the hour: GitHub drops scheduled runs
    # under load, and :00 is by far the most contended minute.
    - cron: '37 6 * * *'
  workflow_dispatch:
    inputs:
      commits:
        description: 'How many commits to make (blank = random in range)'
        required: false
        type: string

# Number of commits per scheduled run is picked randomly in this range.
# Set both to the same value for a fixed count.
env:
  MIN_COMMITS: '3'
  MAX_COMMITS: '15'

permissions:
  contents: write

concurrency:
  group: daily-commit
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: Verify PAT secret is present
        env:
          PAT: ${{ secrets.PAT }}
        run: |
          if [ -z "$PAT" ]; then
            echo "::error::Secret 'PAT' is not set. See the README for how to create it."
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT }}

      - name: Bump counter and commit
        env:
          INPUT_COMMITS: ${{ inputs.commits }}
        run: |
          set -euo pipefail

          git config user.name 'NikolaLetvencuk'
          git config user.email '149421331+NikolaLetvencuk@users.noreply.github.com'

          # How many commits this run?
          count="${INPUT_COMMITS:-}"
          if [ -z "$count" ]; then
            span=$(( MAX_COMMITS - MIN_COMMITS + 1 ))
            count=$(( (RANDOM % span) + MIN_COMMITS ))
          fi
          if ! [ "$count" -ge 1 ] 2>/dev/null; then
            echo "::error::Invalid commit count: '$count'"
            exit 1
          fi
          echo "Making $count commit(s)."

          if [ ! -f counter.txt ]; then
            echo "counter.txt missing - initializing to 0"
            printf '0\n' > counter.txt
          fi

          start="$(tr -cd '0-9' < counter.txt)"
          start="${start:-0}"
          made=0

          for _ in $(seq 1 "$count"); do
            current="$(tr -cd '0-9' < counter.txt)"
            current="${current:-0}"
            printf '%s\n' "$(( 10#$current + 1 ))" > counter.txt

            if [ -z "$(git status --porcelain counter.txt)" ]; then
              echo "counter.txt unchanged - nothing to commit, skipping."
              continue
            fi

            git add counter.txt
            git commit -m 'chore: daily counter bump'
            made=$(( made + 1 ))
          done

          if [ "$made" -eq 0 ]; then
            echo "No commits made - nothing to push."
            exit 0
          fi

          git push
          echo "counter: $start -> $(tr -cd '0-9' < counter.txt) ($made commits)" >> "$GITHUB_STEP_SUMMARY"
