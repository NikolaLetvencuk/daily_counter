name: Daily commit

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

# Not strictly needed: the push is authenticated with secrets.PAT, not
# GITHUB_TOKEN. Kept as a safeguard so the job still has write access if the
# checkout step is ever switched back to the default token.
permissions:
  contents: write

# Don't let a delayed run collide with the next one.
concurrency:
  group: daily-commit
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: Verify PAT secret is present
        env:
          PAT: ${{ secrets.PAT }}
        run: |
          if [ -z "$PAT" ]; then
            echo "::error::Secret 'PAT' is not set. See the README for how to create it."
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # Authenticates the later `git push` as the PAT's owner rather than
          # as github-actions[bot]. persist-credentials defaults to true, so
          # this token is reused by the push below.
          token: ${{ secrets.PAT }}

      - name: Increment counter
        run: |
          set -euo pipefail
          if [ ! -f counter.txt ]; then
            echo "counter.txt missing - initializing to 0"
            printf '0\n' > counter.txt
          fi
          current="$(tr -cd '0-9' < counter.txt)"
          current="${current:-0}"
          next="$((10#$current + 1))"
          printf '%s\n' "$next" > counter.txt
          echo "counter: $current -> $next" >> "$GITHUB_STEP_SUMMARY"

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name 'NikolaLetvencuk'
          git config user.email '149421331+NikolaLetvencuk@users.noreply.github.com'

          if [ -z "$(git status --porcelain counter.txt)" ]; then
            echo "counter.txt unchanged - nothing to commit, skipping."
            exit 0
          fi

          git add counter.txt
          git commit -m 'chore: daily counter bump'
          git push
